[project]
name = "citibike-pipeline"
version = "0.1.0"
description = "Citi Bike GBFS + Open-Meteo stream pipeline: Airflow DAGs for Kafka ingest and micro-batches"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "confluent-kafka>=2.3,<3",
    "pydantic>=2.13.5",
    "requests>=2.31,<3",
]

[project.scripts]
citibike-sample = "citibike_producer.synthetic:main"
citibike-status = "citibike_pipeline.status:main"

[dependency-groups]
# Everything runs in the Airflow image, which provides pyarrow/boto3 pinned by Airflow's constraints.
# They are dev-only here so the libraries can be tested locally.
dev = ["pytest>=7", "pyarrow>=14", "boto3>=1.28", "moto[s3]>=4.2", "ruff>=0.6", "mypy>=1.14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["citibike_contract", "citibike_producer", "citibike_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["F", "E", "W", "B", "I", "UP", "C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR1702", "RUF100"]
# PLR1702 is a preview rule. explicit-preview-rules enables only the preview rules selected by exact code.
preview = true
explicit-preview-rules = true
# House style: typing.Optional/List and %-formatting (Airflow 2.7 and the producer image run Python 3.9).
# Any and Dict are banned by scripts/check_strong_types.py (see CODING_STANDARDS.md).
ignore = ["UP006", "UP007", "UP031", "UP035", "UP045"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 12
max-returns = 6
max-statements = 30
max-nested-blocks = 3

[tool.ruff.lint.per-file-ignores]
# tests have long fixtures and builders; the limits apply to the code under test.
"tests/**" = ["PLR0913", "PLR0915", "PLR1702", "RUF100"]

[tool.ruff.lint.isort]
known-first-party = ["citibike_contract", "citibike_producer", "citibike_pipeline"]
# dags/ imports its sibling _common the way Airflow does (the DAG folder is on sys.path).
known-third-party = ["_common"]

[tool.mypy]
python_version = "3.9"
files = ["citibike_contract", "citibike_pipeline", "citibike_producer", "dags", "scripts"]
explicit_package_bases = true
mypy_path = "dags"            # dags/ imports its sibling _common the way Airflow does
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["airflow.*", "confluent_kafka.*", "pyarrow.*", "boto3.*", "botocore.*", "moto.*", "requests.*", "pendulum.*"]
ignore_missing_imports = true

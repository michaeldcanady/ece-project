[project]
name = "citibike-producer"
version = "0.1.0"
description = "Citi Bike GBFS and Open-Meteo producer for the Stream-Visualization pipeline"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "confluent-kafka>=2.3,<3",
    "requests>=2.31,<3",
]

[project.scripts]
citibike-producer = "citibike_producer.__main__:main"
citibike-create-topics = "citibike_producer.create_topics:main"

[dependency-groups]
dev = ["pytest>=7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["citibike_producer"]

[tool.pytest.ini_options]
testpaths = ["tests"]

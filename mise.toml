[env]
CB_BOOTSTRAP_SERVERS = "kafka:9092"
AIRFLOW_URL = "http://airflow:8080"
AIRFLOW_AUTH = "admin:admin"   # dev only, matches docker-compose.yml

[tools]
python = "3.9"
uv = "latest"
node = "22"          # only for the agent workflows in .sandcastle/
actionlint = "latest"
typos = "latest"

# mise is the interface to the project: every command a person runs is a task here (`mise tasks` lists them).
# uv is only the package manager the tasks call. The pipeline itself runs as Airflow DAGs; these tasks set up
# the dev environment, inspect the stack and trigger DAGs. They run inside the dev container (the hostnames
# `kafka` and `airflow` only resolve there).

[tasks.sync]
description = "Install the locked dependencies into .venv (run by the dev container on create)"
run = "uv sync --locked --all-groups"

[tasks.lock]
description = "Re-resolve uv.lock after editing dependencies in pyproject.toml"
run = "uv lock"

[tasks.status]
description = "Lake health: last batch age, stations, at-risk counts, latency (fails if stale)"
run = "uv run citibike-status"

[tasks."broker:check"]
description = "Fail unless the Kafka broker is reachable and the pipeline topics exist"
run = "uv run python -m citibike_producer.broker check"

[tasks."dag:trigger"]
description = "Trigger a DAG run: mise run dag:trigger <dag_id> ['<json conf>']"
usage = '''
arg "<dag_id>" help="e.g. citibike_setup, citibike_replay"
arg "[conf]" help="JSON run config, e.g. {\"speed\": 60}" default="{}"
'''
run = '''
set -e
curl -sS --fail-with-body -u "$AIRFLOW_AUTH" -H 'Content-Type: application/json' \
  -X POST "$AIRFLOW_URL/api/v1/dags/$usage_dag_id/dagRuns" -d "{\"conf\": $usage_conf}"
echo
'''

[tasks."capture:synthetic"]
description = "Regenerate the synthetic sample capture (offline), written to data/sample/"
run = "uv run citibike-sample data/sample/sample_capture.jsonl.gz --start 2026-10-20T12:00:00Z --minutes 45"

[tasks."capture:export-real"]
description = "Export the newest 45 minutes of real Kafka data as data/sample/real_capture.jsonl.gz (needs the running stack)"
run = "uv run python scripts/export_real_capture.py"

[tasks."qlik:export"]
description = "Export the lake's serving tables as CSVs in data/qlik_export/ to upload to Qlik Cloud"
run = "uv run python scripts/export_qlik_csv.py"

[tasks."kafka:replay"]
description = "Replay the committed sample through Kafka at 60x (citibike_replay DAG)"
run = "mise run dag:trigger citibike_replay '{\"speed\": 60}'"

[tasks."kafka:consume-status"]
description = "Show the 3 oldest messages of each citibike.station_status partition"
run = "uv run python -m citibike_producer.broker peek citibike.station_status --count 3"

[tasks."kafka:consume-poll"]
description = "Show the 3 newest messages of pipeline.poll_log"
run = "uv run python -m citibike_producer.broker peek pipeline.poll_log --count 3 --newest"

[tasks."kafka:verify"]
description = "Verify messages in both main topics"
depends = ["kafka:consume-status", "kafka:consume-poll"]

[tasks."e2e:live"]
description = "Live end-to-end check: reprocess Kafka's real messages into an isolated lake and verify the cleaning, the serving files and the live lake's latency and continuity (needs the running stack; not part of check)"
run = "mkdir -p logs/e2e_live && uv run python -m tests.e2e_live --report logs/e2e_live/$(date -u +%Y-%m-%dT%H%MZ).md"

[tasks."agent:setup"]
description = "Walk through the one-time setup of the nightly Sandcastle workflows (secrets, labels, backlog issues, first dry run)"
run = "bash .sandcastle/setup.sh"

[tasks."typecheck:agent"]
description = "Typecheck the TypeScript agent workflows in .sandcastle/ (installs their locked dependencies first)"
run = ["npm ci --prefix .sandcastle --no-audit --no-fund", "npm run --prefix .sandcastle typecheck"]

[tasks."test:agent"]
description = "Unit tests for the agent workflows in .sandcastle/ (run after typecheck:agent has installed the dependencies)"
run = "npm run --prefix .sandcastle test"

[tasks.lint]
description = "Lint: ruff, the strong-types, mypy, layer, agent-label and prompt-argument checks, actionlint on the workflows, then a typos spell check"
run = ["uv run -q ruff check .", "uv run -q python scripts/check_strong_types.py", "uv run -q python scripts/check_mypy.py", "uv run -q python scripts/check_layers.py", "uv run -q python scripts/check_agent_labels.py", "uv run -q python scripts/check_prompt_args.py", "actionlint", "typos"]

[tasks.test]
description = "Run the tests (no network or broker needed)"
run = "uv run pytest -v"

[tasks.check]
description = "Everything CI and the pre-commit hook run: lint, the agent typecheck, then tests"
run = ["mise run lint", "mise run typecheck:agent", "mise run test:agent", "uv run -q pytest -q -rs"]

[tasks."smoke:replay"]
description = "Replay the committed sample through the running stack"
depends = ["broker:check", "kafka:replay"]

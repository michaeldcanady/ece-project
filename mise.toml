[env]
CB_BOOTSTRAP_SERVERS = "kafka:9092"
AIRFLOW_URL = "http://airflow:8080"
AIRFLOW_AUTH = "admin:admin"   # dev only, matches docker-compose.yml

[tools]
python = "3.9"
uv = "latest"

# Everything that runs is an Airflow DAG; these tasks inspect the stack or trigger DAGs from the dev shell.
# They run inside the dev container (the hostnames `kafka` and `airflow` only resolve there).
# kcat is installed by .devcontainer/Dockerfile; the Kafka CLIs are not available in this container.

[tasks."broker:check"]
description = "Fail unless the Kafka broker is reachable and the pipeline topics exist"
run = '''
set -e
echo "CB_BOOTSTRAP_SERVERS=$CB_BOOTSTRAP_SERVERS"
topics=$(kcat -b "$CB_BOOTSTRAP_SERVERS" -L -J | python3 -c "import sys,json; print(' '.join(sorted(t['topic'] for t in json.load(sys.stdin)['topics'])))")
echo "topics: $topics"
for t in citibike.station_status citibike.station_info weather.current pipeline.poll_log pipeline.dlq; do
  case " $topics " in *" $t "*) ;; *) echo "MISSING topic $t (trigger: mise run dag:trigger citibike_setup)"; exit 1;; esac
done
'''

[tasks."dag:trigger"]
description = "Trigger a DAG run: mise run dag:trigger <dag_id> ['<json conf>']"
usage = '''
arg "<dag_id>" help="e.g. citibike_setup, citibike_replay"
arg "[conf]" help="JSON run config, e.g. {\"speed\": 60}" default="{}"
'''
run = '''
set -e
curl -sS --fail-with-body -u "$AIRFLOW_AUTH" -H 'Content-Type: application/json' \
  -X POST "$AIRFLOW_URL/api/v1/dags/$usage_dag_id/dagRuns" -d "{\"conf\": $usage_conf}"
echo
'''

[tasks."capture:synthetic"]
description = "Regenerate the synthetic sample capture (offline), written to data/sample/"
run = "uv run citibike-sample data/sample/sample_capture.jsonl.gz --start 2026-10-20T12:00:00Z --minutes 45"

[tasks."kafka:replay"]
description = "Replay the committed sample through Kafka at 60x (citibike_replay DAG)"
run = "mise run dag:trigger citibike_replay '{\"speed\": 60}'"

[tasks."kafka:consume-status"]
description = "Show the 3 oldest messages of citibike.station_status"
run = 'kcat -b "$CB_BOOTSTRAP_SERVERS" -t citibike.station_status -C -o beginning -c 3 -e -q'

[tasks."kafka:consume-poll"]
description = "Show the 3 newest messages of pipeline.poll_log"
run = 'kcat -b "$CB_BOOTSTRAP_SERVERS" -t pipeline.poll_log -C -o -3 -c 3 -e -q'

[tasks."kafka:verify"]
description = "Verify messages in both main topics"
depends = ["kafka:consume-status", "kafka:consume-poll"]

[tasks.lint]
description = "Lint (ruff)"
run = "uv run ruff check ."

[tasks."test:unit"]
description = "Run the tests (no network or broker needed)"
run = "uv run pytest -v"

[tasks."smoke:replay"]
description = "Replay the committed sample through the running stack"
depends = ["broker:check", "kafka:replay"]

name: spec

# Adding the `agent:spec` label to an issue expands its short note into a full spec (Problem, Files, Proposal,
# Benefits, Tests, Acceptance criteria, Out of scope) and replaces the issue body, keeping the note under
# "Original note", rates it, and labels it `agent:candidate` plus one `strength:*` (replacing a stale one).
# Nothing is implemented, with one exception: a strong-rated issue labeled `request` also gets `agent:implement`
# (added with AGENT_PAT so it starts implement.yml). Any other issue waits for a human to add it.
#
# A failed or cancelled run gets one retry: the `blocked` job adds `agent:recovered` and re-adds `agent:spec` with
# AGENT_PAT (a label added with GITHUB_TOKEN starts no workflow). A second failure removes `agent:spec` and leaves
# the issue unchanged and labeled `agent:blocked`. A success removes `agent:recovered` and `agent:blocked`.
#
# Same split as improve.yml: the agent job is read-only and holds only the OAuth token; separate jobs with
# `issues: write` (and the PAT) apply the result.

on:
  issues:
    types: [labeled]

jobs:
  fetch:
    if: github.event.label.name == 'agent:spec'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: read
    steps:
      # The issue text is untrusted input: it goes to a JSON file, never into shell or `${{ }}`.
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/issue"
          # `gh issue view` has no author-association field, so it comes from the REST API (as `author_association`).
          association=$(gh api "repos/$GH_REPO/issues/$ISSUE_NUMBER" --jq .author_association)
          gh issue view "$ISSUE_NUMBER" --json title,body,comments,labels \
            | jq --arg a "$association" '. + {authorAssociation: $a}' > "$RUNNER_TEMP/issue/issue.json"
      - uses: actions/upload-artifact@v4
        with:
          name: issue
          path: ${{ runner.temp }}/issue/issue.json

  scan:
    needs: fetch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: spec-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@v2
      - run: mise run sync
      - run: |
          npm ci --prefix .sandcastle
          npm install -g @anthropic-ai/claude-code
      - uses: actions/download-artifact@v4
        with:
          name: issue
          path: ${{ runner.temp }}/issue
      - name: Expand the note
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ISSUE_FILE: ${{ runner.temp }}/issue/issue.json
          OUTPUT_DIR: ${{ runner.temp }}/out
        run: npx --prefix .sandcastle tsx .sandcastle/spec/spec.ts
      - uses: actions/upload-artifact@v4
        with:
          name: spec
          path: ${{ runner.temp }}/out/spec.json

  apply:
    needs: scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix .sandcastle
      - uses: actions/download-artifact@v4
        with:
          name: issue
          path: ${{ runner.temp }}/issue
      - uses: actions/download-artifact@v4
        with:
          name: spec
          path: ${{ runner.temp }}/spec
      - name: Replace the issue body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_FILE: ${{ runner.temp }}/issue/issue.json
          SPEC_DIR: ${{ runner.temp }}/spec
          AGENT_PAT: ${{ secrets.AGENT_PAT }} # labels a strong request agent:implement; GITHUB_TOKEN would not start implement.yml
        run: npx --prefix .sandcastle tsx .sandcastle/spec/apply.ts

  blocked:
    needs: [fetch, scan, apply]
    # Cancelled and timed-out jobs count as failures, same as errors.
    if: always() && needs.fetch.result != 'skipped' && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix .sandcastle
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          AGENT_PAT: ${{ secrets.AGENT_PAT }} # re-adds agent:spec for the retry; GITHUB_TOKEN would not start this workflow
        run: npx --prefix .sandcastle tsx .sandcastle/spec/blocked.ts

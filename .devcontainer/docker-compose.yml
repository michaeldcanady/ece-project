# The whole stack is tied to the VS Code window: "Reopen in Container" starts it, closing the window
# stops it (devcontainer.json: shutdownAction stopCompose). State lives in named volumes, so a stop/start
# or a rebuild keeps Kafka's log, the Postgres metadata and the local lake.
# Gaps while the window is closed show up in pipeline.poll_log and in the daily quality report.
name: ece-projec

services:
  app:
    image: mcr.microsoft.com/devcontainers/python:3.9   # tools come from devcontainer.json features
    volumes:
      - ..:/workspaces/ece-projec
      - lake:/lake:ro                      # inspect the local lake from the dev shell
    command: sleep infinity
    network_mode: service:kafka
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      - CB_BOOTSTRAP_SERVERS=kafka:9092
      - CB_LOCAL_ROOT=/lake

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zk-data:/var/lib/zookeeper/data    # persisted together with Kafka's data: a mismatch breaks startup
      - zk-log:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "29092:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics come from the citibike_setup DAG only. Auto-creation would silently make topics with
      # 7-day retention and no compaction when a producer starts first.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_RETENTION_HOURS: 504       # 21 days: the capture outlives a long weekend of downtime
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10

  volume-init:
    # Named volumes are created root-owned; the airflow user (uid 50000) must be able to write the lake and logs.
    image: busybox:1.36
    command: ["chown", "-R", "50000:0", "/lake", "/logs"]
    volumes:
      - lake:/lake
      - airflow-logs:/logs
    restart: "no"

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow:
    build:
      context: ./airflow
    image: ece-projec-airflow
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      volume-init:
        condition: service_completed_successfully
    # Optional overrides, e.g. CB_STORAGE=s3, CB_S3_BUCKET=..., AWS_ACCESS_KEY_ID=... (see .env.example)
    env_file:
      - path: .env
        required: false
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__FERNET_KEY: ''         # dev only
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'true'
      PYTHONPATH: /opt/airflow/project      # project source (citibike_contract, _producer, _pipeline)
      CB_BOOTSTRAP_SERVERS: kafka:9092
      CB_LOCAL_ROOT: /opt/airflow/data
      CB_PRODUCER_VERSION: ${GIT_SHA:-dev}
      # Basic auth on the REST API, so `mise run dag:trigger` works from the dev shell (dev only).
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
      _AIRFLOW_DB_UPGRADE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'      # dev only
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
    volumes:
      - ../dags:/opt/airflow/dags:ro
      - ..:/opt/airflow/project:ro
      - airflow-logs:/opt/airflow/logs
      - lake:/opt/airflow/data
    ports:
      - "8080:8080"
    command: standalone
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s

volumes:
  pgdata:
  kafka-data:
  zk-data:
  zk-log:
  lake:
  airflow-logs:
